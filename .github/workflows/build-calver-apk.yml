name: Build APK (Memos 26.10)

on:
  workflow_dispatch:
  push:
    branches:
      - memos-26.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace assembleDebug > build.log 2>&1; then
            grep -vE "^> Task|^\s*at |^$" build.log | grep -iE "^e: |error|wrong|exception|could not|failed|requires|caused" | head -45 > errs.txt
            [ -s errs.txt ] || grep -vE "^> Task|^$" build.log | tail -45 > errs.txt
            split -l 5 errs.txt part_
            for f in part_*; do
              msg=$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f::${msg}"
            done
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoeMemos-26.10
          path: app/build/outputs/apk/debug/*.apk
