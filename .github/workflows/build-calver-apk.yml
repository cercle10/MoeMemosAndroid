name: Build APK (Memos 26.10)

on:
  workflow_dispatch:
  push:
    branches:
      - memos-26.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace assembleDebug > build.log 2>&1; then
            { grep -E "^e: " build.log; grep -A8 "What went wrong" build.log; } | grep -v "^> Task" | head -9 > errs.txt
            msg=$(sed 's/%/%25/g' errs.txt | awk '{printf "%s%%0A", $0}')
            echo "::error::${msg}"
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoeMemos-26.10
          path: app/build/outputs/apk/debug/*.apk
