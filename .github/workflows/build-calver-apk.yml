name: Build APK (Memos 26.10)

on:
  workflow_dispatch:
  push:
    branches:
      - memos-26.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log; then
            grep -nE "^e: |What went wrong|error:|Error|FAILED|Could not|requires|> " build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            tail -15 build.log | while IFS= read -r line; do echo "::error::TAIL ${line//%/%25}"; done
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoeMemos-26.10
          path: app/build/outputs/apk/debug/*.apk
